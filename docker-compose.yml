services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file: backend/.env
    command: sh -c "flask --app app db upgrade && gunicorn --bind 0.0.0.0:5000 --workers 2 --threads 2 --timeout 120 app:app"
    ports: ["127.0.0.1:5000:5000"]
    volumes:
      - automator-data:/app/instance
      - automator-uploads:/app/uploads
      - automator-generated:/app/generated
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
  worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file: backend/.env
    command: python worker.py
    volumes:
      - automator-data:/app/instance
      - automator-uploads:/app/uploads
      - automator-generated:/app/generated
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
volumes:
  automator-data: {}
  automator-uploads: {}
  automator-generated: {}
