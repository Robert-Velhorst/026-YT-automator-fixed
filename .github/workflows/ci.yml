name: CI
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.13.17"
            lock: backend/requirements-py313.lock
          - python-version: "3.15.1"
            lock: backend/requirements-py315.lock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: ${{ matrix.lock }}
      - run: 'python -m pip install --only-binary=:all: --require-hashes -r ${{ matrix.lock }}'
      - run: python -m pip check
      - run: pytest -q
        working-directory: backend
      - run: flask --app app db upgrade
        working-directory: backend
        env:
          DATABASE_URL: sqlite:////tmp/studiopilot-ci.db

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.12.1
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npm audit --audit-level=low
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  windows-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15.1"
          cache: pip
          cache-dependency-path: backend/requirements-py315.lock
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.12.1
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: 'python -m pip install --only-binary=:all: --require-hashes -r backend/requirements-py315.lock'
      - run: python -m pip check
      - name: Parse Windows launch scripts
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem scripts/windows/*.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) { $errors | Write-Error; $failed = $true }
          }
          if ($failed) { exit 1 }
      - run: python -m pytest backend/tests -q
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15.1"
      - run: 'python -m pip install --only-binary=:all: --index-url https://pypi.org/simple pip-audit==2.10.1'
      - name: Audit every pinned package, including inactive platform markers
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import os
          import re
          for source in Path('backend').glob('requirements-py*.lock'):
              pins = sorted(set(re.findall(r'^([A-Za-z0-9_.-]+)==([^\s;\\]+)', source.read_text(), re.M)))
              if not pins:
                  raise SystemExit('Missing locked package inventory: ' + source.name)
              target = Path(os.environ['RUNNER_TEMP']) / (source.stem + '-audit.txt')
              target.write_text('\n'.join(name + '==' + version for name, version in pins) + '\n')
          PY
          for version in 313 314 315; do
            python -m pip_audit --disable-pip --no-deps -r "$RUNNER_TEMP/requirements-py$version-audit.txt"
          done

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the actual Python 3.15.1 production image
        run: docker build --file Dockerfile.backend --tag studiopilot:qualification .
      - name: Record installed versions without application startup or databases
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          docker image inspect --format '{{.Id}}' studiopilot:qualification > output/image-id.txt
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges studiopilot:qualification python -c '
          import importlib.metadata as m
          import hashlib, json, os, platform, sqlite3, ssl, subprocess
          from pathlib import Path
          import psycopg.pq
          from cryptography.hazmat.bindings.openssl.binding import Binding
          binding = Binding()
          profile = json.loads(Path("/app/sqlite-runtime.json").read_text())
          provenance = json.loads(Path("/usr/share/doc/sqlite-libs/studiopilot-build.json").read_text())
          sqlite_hash = hashlib.sha256(Path("/usr/lib/libsqlite3.so.0").read_bytes()).hexdigest()
          assert sqlite3.sqlite_version == profile["version"] == provenance["version"]
          assert sqlite_hash == provenance["binary_sha256"]
          assert profile["source_sha3_256"] == provenance["source_sha3_256"]
          sqlite_packages = subprocess.check_output(["apk", "--no-network", "list", "--installed", "sqlite-libs"], text=True).strip().splitlines()
          assert len(sqlite_packages) == 1
          sqlite_package = sqlite_packages[0].split()[0]
          assert sqlite_package == "sqlite-libs-" + profile["version"] + "-r0"
          print(json.dumps({"python": platform.python_version(), "uid": os.getuid(),
              "sqlite": sqlite3.sqlite_version, "python_ssl": ssl.OPENSSL_VERSION,
              "sqlite_package": sqlite_package, "sqlite_build": provenance, "sqlite_binary_sha256": sqlite_hash,
              "cryptography_ssl": binding.ffi.string(binding.lib.OpenSSL_version(0)).decode(),
              "libpq": psycopg.pq.version(), "packages": {d.metadata["Name"]: d.version for d in m.distributions()},
              "operator_database_opened": False, "application_started": False, "deployment_acceptance": False}))
          ' > output/installed-runtime.json
      - name: Run the existing backend suite against the exact installed image
        run: |
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges \
            --tmpfs /tmp:rw,noexec,nosuid,size=256m,mode=1777 \
            --tmpfs /app/instance:rw,noexec,nosuid,size=64m,uid=10001,gid=10001,mode=0700 \
            --tmpfs /app/uploads:rw,noexec,nosuid,size=64m,uid=10001,gid=10001,mode=0700 \
            --tmpfs /app/generated:rw,noexec,nosuid,size=64m,uid=10001,gid=10001,mode=0700 \
            --memory 768m --cpus 2 studiopilot:qualification \
            python -m pytest tests -q -p no:cacheprovider --basetemp=/tmp/studiopilot-ci
      - name: Scan all installed OS and Python packages without advisory exclusions
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/output:/output" aquasec/trivy:0.76.1 image --ignorefile /dev/null --scanners vuln --list-all-pkgs --format json --output /output/image-security.json --exit-code 1 studiopilot:qualification
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: studiopilot-installed-image-${{ github.event_name }}
          path: output/*
          if-no-files-found: error
